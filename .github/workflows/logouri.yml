name: logouri-branduri
on:
  push:
    paths: ['logo-job/start.txt']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  descarca:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - name: Descarca logourile de pe site-urile oficiale
        working-directory: logo-job
        run: python -u logouri_site.py > log_rulare.txt 2>&1 || true
      - name: Salveaza rezultatul
        run: |
          git config user.name "logo-bot"
          git config user.email "logo-bot@users.noreply.github.com"
          git add logo-job
          git commit -m "Logouri descarcate de pe site-urile oficiale" || echo nimic
          git push
